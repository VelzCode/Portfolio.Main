<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Landscape tablet frame</title>
  <desc id="desc">Dark rounded tablet bezel with edge highlights, a left camera, and a soft shadow. The screen opening is transparent.</desc>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45434c"/>
      <stop offset="0.12" stop-color="#171a23"/>
      <stop offset="0.65" stop-color="#080c13"/>
      <stop offset="1" stop-color="#303039"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aaa3b5" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#777380" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="screen-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#807187" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#535666" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="lens">
      <stop offset="0" stop-color="#233049"/>
      <stop offset="0.55" stop-color="#080b12"/>
      <stop offset="1" stop-color="#626b80"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>
  <path fill="url(#bezel)" fill-rule="evenodd" filter="url(#shadow)" d="M64 25H836A34 34 0 0 1 870 59V531A34 34 0 0 1 836 565H64A34 34 0 0 1 30 531V59A34 34 0 0 1 64 25Z M71 48H829A15 15 0 0 1 844 63V527A15 15 0 0 1 829 542H71A15 15 0 0 1 56 527V63A15 15 0 0 1 71 48Z"/>
  <rect x="30.5" y="25.5" width="839" height="539" rx="33.5" fill="none" stroke="url(#edge)"/>
  <rect x="56" y="48" width="788" height="494" rx="15" fill="none" stroke="url(#screen-edge)"/>
  <circle cx="43" cy="295" r="3" fill="url(#lens)"/>
  <rect x="870" y="90" width="3" height="48" rx="1.5" fill="#45444b"/>
</svg>
