<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9f6f7"/>
      <stop offset="100%" stop-color="#004dae"/>
    </linearGradient>
    <filter id="borderGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    x="1.5" y="1.5" width="61" height="61" rx="13"
    fill="none"
    stroke="#3d6fae"
    stroke-width="1.5"
    filter="url(#borderGlow)"
  />

  <text
    x="32" y="42"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="27"
    fill="url(#textGrad)"
    letter-spacing="-0.5"
  >JD</text>
</svg>
